name: Data refresh

on:
  schedule:
    - cron: '17 3 * * *' # ежедневно 03:17 UTC (10:17 НСК)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Обновить курсы ЦБ РФ
        run: node scripts/fetch-cbr.mjs
      - name: Wordstat (только с токеном)
        run: node scripts/fetch-wordstat.mjs
        env:
          WORDSTAT_TOKEN: ${{ secrets.WORDSTAT_TOKEN }}
      - name: Обновить мету
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data/meta.json','utf8'));m.generated_at=new Date().toISOString();fs.writeFileSync('data/meta.json',JSON.stringify(m,null,2)+'\n')"
      - name: Commit если изменилось
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" || git commit -m "data: обновление источников $(date +%F)"
          git push
