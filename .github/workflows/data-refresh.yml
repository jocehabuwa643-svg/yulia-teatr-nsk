name: Data refresh

on:
  schedule:
    - cron: '17 3 * * *' # ежедневно 03:17 UTC (10:17 НСК)
  workflow_dispatch:

# contents: write — коммит данных; actions: write — запуск деплоя (пуш от GITHUB_TOKEN сам workflow не запускает)
permissions:
  contents: write
  actions: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Секрет доступен шагам только через env; в лог он не печатается (GitHub маскирует значение)
      WORDSTAT_TOKEN: ${{ secrets.WORDSTAT_TOKEN }}
      WORDSTAT_FOLDER_ID: ${{ vars.WORDSTAT_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Сбой источника не валит джоб: скрипт сам оставляет прежние данные и ставит stale
      - name: Курсы ЦБ РФ
        continue-on-error: true
        run: node scripts/fetch-cbr.mjs

      # Новости отрасли (RSS: Минкультуры РФ и НСО, Правительство НСО, УФНС по НСО). Записи копятся 60 дней (не больше 40);
      # сбой лент не валит джоб — прежние записи остаются, при полном сбое ставится stale:true. Файл не переписывается,
      # если по существу ничего не изменилось, — пустых коммитов не будет. Коммит ниже берёт весь data/, news.json в том числе
      - name: Новости отрасли
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/fetch-news.mjs

      # Только если секрет задан
      - name: Спрос Wordstat
        if: ${{ env.WORDSTAT_TOKEN != '' }}
        continue-on-error: true
        run: node scripts/fetch-wordstat.mjs

      # Каждый день: валидность JSON и напоминание (::warning) о незагруженном календаре каникул — прогон не падает
      - name: Напоминание о календаре каникул
        run: node scripts/touch-meta.mjs

      # fetch-cbr.mjs не сдвигает fetched_at, если курс и дата ЦБ те же и stale нет — тогда diff пуст и коммита не будет
      - name: Проверить, изменились ли данные
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Данные не изменились — коммит не нужен"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Метка времени и проверка JSON — только при реальных изменениях; тесты — страховка от битых данных
      - name: Проверка и метка времени
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/touch-meta.mjs --stamp
          node --test

      - name: Коммит и пуш
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: обновление источников $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Пуш от GITHUB_TOKEN не запускает deploy.yml — запускаем явно, чтобы сайт получил свежие данные
      - name: Пересобрать сайт
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
